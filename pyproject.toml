[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odysseus"
version = "0.2.0"
description = "Local-first autonomous agent (Lindy-like) with planner, memory, and skills."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "sqlmodel>=0.0.22",
  "python-dotenv>=1.0",
  "beautifulsoup4>=4.12",
  "openai>=1.51",
  "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "black>=24.10", "mypy>=1.13"]
integrations = [
  "google-api-python-client>=2.151",
  "google-auth>=2.35",
  "slack_sdk>=3.33",
  "notion-client>=2.2"
]
